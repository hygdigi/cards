<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Birthday Adventure | Choose Your Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        
        .card {
            position: relative;
            z-index: 10;
            background: white;
            border-radius: 40px;
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,0.3);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: translateY(0); } }
        
        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa502 50%, #667eea 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
            flex-shrink: 0;
        }
        
        .emoji { font-size: 3.5rem; margin-bottom: 15px; display: block; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        .title { font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 5px; }
        .subtitle { font-size: 0.95rem; opacity: 0.95; }
        
        .body {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .step-title { font-size: 1.3rem; font-weight: 700; color: #333; margin-bottom: 20px; }
        .step-desc { font-size: 0.95rem; color: #666; margin-bottom: 25px; line-height: 1.6; }
        
        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .choice-btn {
            padding: 20px 15px;
            border-radius: 18px;
            border: 2px solid #eee;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
        }
        
        .choice-btn:hover {
            border-color: #ff6b9d;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.2);
        }
        
        .choice-btn.selected {
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa502 100%);
            color: white;
            border-color: transparent;
        }
        
        .result-box {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.1), rgba(255, 165, 2, 0.1));
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            border-left: 5px solid #ff6b9d;
        }
        
        .result-emoji { font-size: 2.5rem; margin-bottom: 10px; }
        .result-text { font-size: 1rem; color: #333; line-height: 1.7; }
        
        .progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s;
        }
        
        .progress-dot.active {
            background: #ff6b9d;
            transform: scale(1.3);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 50px;
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa502 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }
        
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-secondary {
            background: white;
            color: #666;
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover { border-color: #ff6b9d; color: #ff6b9d; }
        
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255,255,255,0.95);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .sound-toggle:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
    
    <div class="card">
        <div class="header">
            <div class="emoji" id="mainEmoji">🎂</div>
            <h1 class="title">Birthday Adventure!</h1>
            <p class="subtitle"><span id="name">Friend</span>, let's make this unforgettable 🎉</p>
        </div>
        
        <div class="body">
            <!-- STEP 1: Choose Mood -->
            <div class="section active" id="step1">
                <div class="progress">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                </div>
                <p class="step-title">🎭 What's your vibe today?</p>
                <p class="step-desc">Choose the celebration energy!</p>
                <div class="choices">
                    <button class="choice-btn" onclick="selectMood('wild')">🤪 Wild & Crazy</button>
                    <button class="choice-btn" onclick="selectMood('chill')">😎 Chill & Cool</button>
                    <button class="choice-btn" onclick="selectMood('romantic')">🌹 Romantic Vibes</button>
                    <button class="choice-btn" onclick="selectMood('epic')">⚡ EPIC MODE</button>
                </div>
            </div>
            
            <!-- STEP 2: Choose Activity -->
            <div class="section" id="step2">
                <div class="progress">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot active"></div>
                    <div class="progress-dot"></div>
                </div>
                <p class="step-title">🎯 Pick your adventure!</p>
                <p class="step-desc">What should we do first?</p>
                <div class="choices">
                    <button class="choice-btn" onclick="selectActivity('party')">🎉 Party Mode</button>
                    <button class="choice-btn" onclick="selectActivity('game')">🎮 Play a Game</button>
                    <button class="choice-btn" onclick="selectActivity('cake')">🍰 Cake Time</button>
                    <button class="choice-btn" onclick="selectActivity('dance')">💃 Dance Battle</button>
                </div>
            </div>
            
            <!-- STEP 3: Final Result -->
            <div class="section" id="step3">
                <div class="progress">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot active"></div>
                    <div class="progress-dot active"></div>
                </div>
                <p class="step-title">✨ Your Birthday Magic!</p>
                <div id="resultBox" class="result-box">
                    <div class="result-emoji" id="resultEmoji">🎉</div>
                    <div class="result-text" id="resultText">Loading your celebration...</div>
                </div>
                <button class="btn btn-primary" onclick="location.reload()">🔄 Try Another Combo</button>
            </div>
        </div>
        
        <!-- Navigation -->
        <div style="padding: 20px 40px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px;">
            <button class="btn btn-secondary" id="backBtn" onclick="goToStep(1)" style="display:none;">← Back</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled>Next →</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('n') || 'Friend';
        document.getElementById('name').textContent = name;
        document.title = `Happy Birthday ${name}! 🎂`;
        
        let soundEnabled = true;
        let currentStep = 1;
        let selectedMood = null;
        let selectedActivity = null;
        
        class SoundEffects {
            constructor() {
                this.audioContext = null;
            }
            
            initAudio() {
                if (!this.audioContext) {
                    try {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        if (this.audioContext.state === 'suspended') {
                            this.audioContext.resume();
                        }
                    } catch (e) {
                        console.warn('AudioContext not supported');
                    }
                }
            }
            
            playCheer() {
                if (!soundEnabled || !this.audioContext) return;
                this.initAudio();
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.type = 'sine';
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch (e) {}
            }
            
            playSuccess() {
                if (!soundEnabled || !this.audioContext) return;
                this.initAudio();
                try {
                    const now = this.audioContext.currentTime;
                    const notes = [600, 800, 1000];
                    notes.forEach((freq, i) => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();
                        osc.type = 'sine';
                        osc.connect(gain);
                        gain.connect(this.audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.2, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0, now + i * 0.1 + 0.1);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.1);
                    });
                } catch (e) {}
            }
        }
        
        const sound = new SoundEffects();
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
        }
        
        function selectMood(mood) {
            selectedMood = mood;
            document.querySelectorAll('#step1 .choice-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
            sound.playCheer();
        }
        
        function selectActivity(activity) {
            selectedActivity = activity;
            document.querySelectorAll('#step2 .choice-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
            sound.playCheer();
        }
        
        function nextStep() {
            if (currentStep === 1 && !selectedMood) return;
            if (currentStep === 2 && !selectedActivity) return;
            
            if (currentStep === 2) {
                generateResult();
            }
            
            goToStep(currentStep + 1);
        }
        
        function goToStep(step) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            currentStep = step;
            
            document.getElementById('backBtn').style.display = step > 1 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = step < 3 ? 'block' : 'none';
            document.getElementById('nextBtn').disabled = step === 2 ? !selectedActivity : (step === 1 ? !selectedMood : false);
            
            updateProgress();
        }
        
        function updateProgress() {
            document.querySelectorAll('.progress-dot').forEach((dot, i) => {
                if (i < currentStep) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }
        
        function generateResult() {
            const results = {
                wild_party: { emoji: '🎪', text: '🎉 PARTY TIME! The confetti cannons are going OFF! Music is BLASTING! This is going to be LEGENDARY!' },
                wild_game: { emoji: '🏆', text: '🎮 GAME ON! Competitive vibes are at MAX LEVEL! May the best player win!' },
                wild_cake: { emoji: '🍰', text: '🍰 CAKE CHAOS! Sprinkles flying everywhere! This cake tastes like pure JOY!' },
                wild_dance: { emoji: '💃', text: '🎶 LET\'S DANCE! The dance floor is YOURS! Show us your best moves!' },
                chill_party: { emoji: '🎉', text: '✨ Vibes are immaculate. Good music, good people, good times ahead.' },
                chill_game: { emoji: '🎮', text: '🕹️ Time for some casual gaming fun. May the odds be ever in your favor.' },
                chill_cake: { emoji: '🧁', text: '🍰 Slice of perfection. Homemade love in every bite.' },
                chill_dance: { emoji: '🎵', text: '🎶 Smooth moves only. Vibes are *chef\'s kiss*' },
                romantic_party: { emoji: '🌹', text: '💕 A night to remember. Surrounded by people who adore you.' },
                romantic_game: { emoji: '❤️', text: '💑 Let\'s play together. Every moment with you is special.' },
                romantic_cake: { emoji: '🎂', text: '💗 A sweet moment just for us. You deserve the best.' },
                romantic_dance: { emoji: '💫', text: '✨ Dancing under the stars. Pure magic.' },
                epic_party: { emoji: '🚀', text: '🎆 THIS IS EPIC! Legendary party mode ACTIVATED! History will be made today!' },
                epic_game: { emoji: '👑', text: '⚔️ ULTIMATE CHAMPION MODE! Victory is your destiny!' },
                epic_cake: { emoji: '⚡', text: '🔥 LEGENDARY CAKE! This isn\'t just cake, it\'s ART!' },
                epic_dance: { emoji: '🌟', text: '🎆 YOU ARE THE STAR! The universe revolves around you!' }
            };
            
            const key = selectedMood + '_' + selectedActivity;
            const result = results[key] || { emoji: '🎉', text: 'Happy Birthday! This is YOUR day!' };
            
            document.getElementById('resultEmoji').textContent = result.emoji;
            document.getElementById('resultText').textContent = result.text;
            
            sound.playSuccess();
            spawnConfetti(100);
        }
        
        // Confetti
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        const colors = ['#ff6b9d', '#ffa502', '#667eea', '#f093fb', '#13c85f'];
        
        function spawnConfetti(count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    vx: (Math.random() - 0.5) * 8,
                    vy: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 10 + 6,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15,
                    life: 1
                });
            }
        }
        
        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.rotation += p.rotationSpeed;
                p.life -= 0.006;
                
                if (p.y > canvas.height || p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }
            
            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }
        
        animateConfetti();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
