<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Blast 🎂</title>
    <meta property="og:title" content="Someone made you a birthday surprise 🎂">
    <meta property="og:description" content="Tap to open your personalized birthday card — made just for you!">
    <meta property="og:image" content="../../preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface2: #1e1e28;
            --border: rgba(255,255,255,0.08);
            --accent: #ff9a3c;
            --accent-glow: rgba(255,154,60,0.25);
            --text: #f0f0f5;
            --text-muted: #7a7a8c;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(255,154,60,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Confetti canvas */
        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Card */
        .card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        /* Top accent bar */
        .card-accent-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #ff4d6d, #a855f7);
        }

        .card-body { padding: 40px 36px; text-align: center; }

        /* Icon area */
        .card-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,154,60,0.1);
            border: 1px solid rgba(255,154,60,0.2);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            margin: 0 auto 24px;
            transition: transform 0.3s ease;
        }

        .card-icon.bounce {
            animation: iconBounce 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes iconBounce {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.2); }
            60% { transform: scale(0.92); }
        }

        /* Name */
        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.6rem, 5vw, 2rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 8px;
        }

        .card-name span {
            background: linear-gradient(90deg, var(--accent), #ff4d6d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        /* CTA button */
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent), #ff6b47);
            color: white;
            border: none;
            padding: 15px 32px;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 24px var(--accent-glow);
            letter-spacing: -0.01em;
            margin-bottom: 24px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255,154,60,0.4);
        }

        .btn-action:active { transform: scale(0.97); }

        /* Message reveal area */
        .message-area {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .message-pill.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* CTA footer */
        .card-footer {
            padding: 18px 36px 28px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-text {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .footer-link {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .footer-link:hover { opacity: 0.8; }

        /* Fade in */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeUp 0.5s ease both; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="card-accent-bar"></div>
        <div class="card-body">
            <div class="card-icon" id="icon">🎂</div>
            <h1 class="card-name">Happy Birthday, <span id="name">Friend</span></h1>
            <p class="card-subtitle">Your day deserves a proper celebration.<br>Tap below to make it rain. 🎊</p>
            <button class="btn-action" onclick="blast()">
                🎉 Launch Confetti
            </button>
            <div class="message-area">
                <div class="message-pill" id="message"></div>
            </div>
        </div>
        <div class="card-footer">
            <span class="footer-text">Made with MagicCards ·</span>
            <a href="../../create.html" class="footer-link">Create yours →</a>
        </div>
    </div>

    <script>
        // Personalize
        const params = new URLSearchParams(window.location.search);
        const name = params.get('n') || 'Friend';
        document.getElementById('name').textContent = name;

        // Update OG title dynamically
        document.title = `Happy Birthday, ${name}! 🎂`;

        const messages = [
            `🌟 Here's to you, ${name} — you're one of a kind!`,
            `🎈 Wishing you the most magical day ever!`,
            `✨ May this year bring you everything you deserve!`,
            `🥂 Cheers to another year of being absolutely amazing!`,
        ];

        let count = 0;

        // Canvas confetti
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const particles = [];
        const colors = ['#ff4d6d', '#ff9a3c', '#4d79ff', '#a855f7', '#22d3ee', '#ffd700'];

        function spawnParticles(n) {
            for (let i = 0; i < n; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 6,
                    shape: Math.random() > 0.5 ? 'rect' : 'circle',
                    life: 1
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.rotation += p.rotationSpeed;
                p.life -= 0.008;

                if (p.y > canvas.height + 20 || p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;

                if (p.shape === 'rect') {
                    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            requestAnimationFrame(drawParticles);
        }

        drawParticles();

        function blast() {
            count++;
            spawnParticles(80);

            // Bounce icon
            const icon = document.getElementById('icon');
            icon.classList.remove('bounce');
            void icon.offsetWidth; // reflow
            icon.classList.add('bounce');

            // Show message
            const msg = document.getElementById('message');
            msg.textContent = messages[(count - 1) % messages.length];
            msg.classList.add('show');
        }
    </script>
</body>
</html>
