<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Blast 🎂 — Epic Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff6b9d; --secondary: #ffa502; --tertiary: #667eea; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            color: #1a1a2e;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.1));
            pointer-events: none;
            animation: float 8s infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-40px); } }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .card {
            position: relative;
            z-index: 10;
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
        .card-header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa502 50%, #667eea 100%);
            padding: 50px 30px 30px;
            text-align: center;
            color: white;
            position: relative;
        }
        .cake-emoji { font-size: 4rem; animation: bounce 2s infinite; display: inline-block; }
        @keyframes bounce { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.15) translateY(-15px); } }
        .card-title { font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 800; margin: 15px 0 5px; letter-spacing: -0.5px; }
        .card-subtitle { font-size: 0.95rem; opacity: 0.95; margin-bottom: 5px; }
        .card-body { padding: 40px 30px; text-align: center; }
        .message { font-size: 1.05rem; color: #555; margin-bottom: 30px; line-height: 1.6; }
        .btn-blast {
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa502 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255,107,157,0.3);
            margin-bottom: 25px;
            font-family: 'Fredoka', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-blast:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255,107,157,0.4); }
        .btn-blast:active { transform: scale(0.95); }
        .result-message { min-height: 30px; font-size: 0.95rem; color: var(--primary); font-weight: 600; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        .footer { padding: 18px 30px; border-top: 1px solid #e5e5e5; font-size: 0.85rem; color: #999; text-align: center; }
        .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .sound-toggle:hover { transform: scale(1.1); }
        .sound-toggle.muted { opacity: 0.6; }
    </style>
</head>
<body>
    <div class="bubble" style="width:100px; height:100px; left:10%; top:20%;"></div>
    <div class="bubble" style="width:150px; height:150px; right:5%; top:50%; animation-delay: 2s;"></div>
    <div class="bubble" style="width:80px; height:80px; left:50%; bottom:10%; animation-delay: 4s;"></div>
    <canvas id="canvas"></canvas>
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
    <div class="card">
        <div class="card-header">
            <div class="cake-emoji">🎂</div>
            <h1 class="card-title">Happy Birthday!</h1>
            <p class="card-subtitle"><span id="name">Friend</span>, you're amazing! 🎉</p>
        </div>
        <div class="card-body">
            <p class="message">Today is YOUR day. Tap the button below to celebrate with confetti, music & birthday magic! 🎊✨</p>
            <button class="btn-blast" onclick="launchParty()">🎉 LAUNCH PARTY</button>
            <div class="result-message" id="resultMessage"></div>
        </div>
        <div class="footer">
            Made with <span style="color: #ff6b9d;">❤️</span> by MagicCards | <a href="../../create.html">Create yours →</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const recipientName = params.get('n') || 'Friend';
        document.getElementById('name').textContent = recipientName;
        document.title = `🎉 Happy Birthday, ${recipientName}!`;

        let soundEnabled = true;
        let particleCount = 0;

        class SoundEffects {
            constructor() {
                this.audioContext = null;
            }
            
            initAudio() {
                if (!this.audioContext) {
                    try {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        if (this.audioContext.state === 'suspended') {
                            this.audioContext.resume().then(() => console.log('Audio resumed'));
                        }
                        console.log('AudioContext initialized');
                    } catch (e) {
                        console.warn('AudioContext not supported', e);
                    }
                }
            }
            
            playChime() {
                if (!soundEnabled) return;
                this.initAudio();
                if (!this.audioContext) { console.log('No audio context'); return; }
                
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.type = 'sine';
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    console.log('Chime played');
                } catch (e) {
                    console.error('Error playing chime:', e);
                }
            }
            
            playCelebration() {
                if (!soundEnabled) return;
                this.initAudio();
                if (!this.audioContext) return;
                
                try {
                    const now = this.audioContext.currentTime;
                    const notes = [600, 800, 1000, 1200];
                    notes.forEach((freq, i) => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();
                        osc.type = 'sine';
                        osc.connect(gain);
                        gain.connect(this.audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.4, now + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
                        osc.start(now + i * 0.12);
                        osc.stop(now + i * 0.12 + 0.25);
                    });
                    console.log('Celebration played');
                } catch (e) {
                    console.error('Error playing celebration:', e);
                }
            }
        }

        const sound = new SoundEffects();

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundToggle').classList.toggle('muted');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#ff6b9d', '#ffa502', '#667eea', '#f093fb', '#13c85f', '#ffd700', '#ff1744'];
        const emojis = ['🎉', '🎊', '🎈', '⭐', '✨', '🎂', '💝'];

        function spawnConfetti(count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    vx: (Math.random() - 0.5) * 8,
                    vy: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 10 + 6,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15,
                    emoji: Math.random() > 0.7 ? emojis[Math.floor(Math.random() * emojis.length)] : null,
                    life: 1
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.rotation += p.rotationSpeed;
                p.life -= 0.006;

                if (p.y > canvas.height || p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);

                if (p.emoji) {
                    ctx.font = `${p.size * 2}px Arial`;
                    ctx.fillText(p.emoji, 0, 0);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                }
                ctx.restore();
            }

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }

        function launchParty() {
            particleCount++;
            spawnConfetti(100);
            animateConfetti();
            
            sound.playChime();
            setTimeout(() => sound.playCelebration(), 200);

            const messages = [
                `🎉 WOOOOH! Let's party, ${recipientName}!`,
                `✨ You deserve ALL the confetti!`,
                `🎊 Best year ever ahead!`,
                `💝 Here's to making memories!`,
                `🌟 You're officially older but still awesome!`
            ];

            const msg = messages[particleCount % messages.length];
            document.getElementById('resultMessage').textContent = msg;
            setTimeout(() => {
                document.getElementById('resultMessage').textContent = '';
            }, 2000);
        }

        window.addEventListener('load', () => {
            setTimeout(() => sound.playChime(), 800);
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
