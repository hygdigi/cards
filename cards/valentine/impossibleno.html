<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine? 🌹</title>
    <meta property="og:title" content="Someone has a Valentine's surprise for you 🌹">
    <meta property="og:description" content="Open this — it's personal and it's for you.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #13131a; --surface2: #1e1e28;
            --border: rgba(255,255,255,0.08);
            --primary: #ff4d6d; --glow: rgba(255,77,109,0.25);
            --text: #f0f0f5; --text-muted: #7a7a8c;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: fixed; top: -20vh; left: 50%; transform: translateX(-50%);
            width: 600px; height: 400px;
            background: radial-gradient(ellipse, rgba(255,77,109,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        #hearts-canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .card {
            position: relative; z-index: 1;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 28px; width: 100%; max-width: 440px;
            overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease both;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
        .accent-bar { height: 3px; background: linear-gradient(90deg, #ff4d6d, #ff9a3c, #a855f7); }
        .card-body { padding: 40px 36px; text-align: center; }
        .card-name {
            font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px;
        }
        .card-name span {
            background: linear-gradient(90deg, #ff4d6d, #ff9a3c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 32px; line-height: 1.6; }
        .btn-group { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 80px; margin-bottom: 16px; }
        .btn {
            padding: 14px 28px; border-radius: 14px; border: none;
            font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        #yesBtn { background: linear-gradient(135deg, #ff4d6d, #ff6b47); color: white; box-shadow: 0 4px 24px rgba(255,77,109,0.3); }
        #yesBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,77,109,0.4); }
        #noBtn { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
        .celebrate { text-align: center; }
        .celebrate h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 12px; color: #ff4d6d; }
        .celebrate p { color: var(--text-muted); font-size: 0.875rem; }
        .try-no { color: var(--text-muted); font-size: 0.75rem; cursor: pointer; text-decoration: underline; margin-top: 12px; display: inline-block; }
        .card-footer {
            padding: 16px 36px 24px; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .footer-text { font-size: 0.75rem; color: var(--text-muted); }
        .footer-link { font-size: 0.75rem; font-weight: 600; color: #ff4d6d; text-decoration: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="hearts-canvas"></canvas>
    <div class="card">
        <div class="accent-bar"></div>
        <div class="card-body">
            <div id="askSection">
                <div style="font-size:3rem; margin-bottom:20px;">🌹</div>
                <h1 class="card-name">Hey <span id="name">there</span>,</h1>
                <p class="subtitle">I've been meaning to ask you something.<br>Will you be my Valentine? 💕</p>
                <div class="btn-group">
                    <button class="btn" id="yesBtn" onclick="sayYes()">Yes! 💖</button>
                    <button class="btn" id="noBtn" onmouseover="dodgeBtn()" ontouchstart="dodgeBtn()">No</button>
                </div>
            </div>
            <div id="celebrateSection" class="celebrate hidden">
                <div style="font-size:3rem; margin-bottom:16px;">🥰</div>
                <h2>Best decision ever!</h2>
                <p>You just made someone's day completely magical.</p>
                <span class="try-no" onclick="tryNo()">Let me try clicking 'No'...</span>
            </div>
        </div>
        <div class="card-footer">
            <span class="footer-text">Made with MagicCards ·</span>
            <a href="../../create.html" class="footer-link">Create yours →</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('n') || 'there';
        document.getElementById('name').textContent = name;
        document.title = `Hey ${name}, will you be my Valentine? 🌹`;

        let yesScale = 1;

        // Canvas hearts
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        const particles = [];
        function spawnHeart() {
            particles.push({ x: Math.random()*canvas.width, y: -20, vy: Math.random()*1.5+0.8, vx: (Math.random()-0.5)*1.5, size: Math.random()*16+10, life: 1 });
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for (let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x+=p.vx; p.y+=p.vy; p.life-=0.004;
                if (p.y>canvas.height||p.life<=0) { particles.splice(i,1); continue; }
                ctx.globalAlpha = p.life * 0.4;
                ctx.font = `${p.size}px serif`;
                ctx.fillText('❤️', p.x, p.y);
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(draw);
        }
        draw();
        setInterval(spawnHeart, 300);

        function dodgeBtn() {
            const btn = document.getElementById('noBtn');
            const yes = document.getElementById('yesBtn');
            btn.style.position = 'fixed';
            btn.style.left = Math.random()*(window.innerWidth-100)+'px';
            btn.style.top = Math.random()*(window.innerHeight-60)+'px';
            yesScale = Math.min(yesScale+0.12, 2);
            yes.style.transform = `scale(${yesScale})`;
        }

        function sayYes() {
            document.getElementById('askSection').classList.add('hidden');
            document.getElementById('celebrateSection').classList.remove('hidden');
            document.getElementById('noBtn').style.display = 'none';
            for(let i=0;i<60;i++) setTimeout(spawnHeart, i*50);
        }

        function tryNo() {
            document.getElementById('celebrateSection').classList.add('hidden');
            document.getElementById('askSection').classList.remove('hidden');
            const btn = document.getElementById('noBtn');
            btn.style.display = '';
            btn.style.position = 'relative';
            btn.style.left = ''; btn.style.top = '';
        }
    </script>
</body>
</html>
