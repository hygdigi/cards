<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffc0e3 100%);
            background-attachment: fixed;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        #heartsCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .card {
            position: relative;
            z-index: 10;
            background: white;
            border-radius: 40px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(255, 107, 157, 0.3);
            animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
        .card-header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4d6d 100%);
            padding: 50px 30px 30px;
            text-align: center;
            color: white;
        }
        .rose-emoji { font-size: 3.5rem; animation: pulse 1.5s infinite; display: inline-block; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .card-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; margin: 15px 0 10px; letter-spacing: -0.5px; }
        .card-subtitle { font-size: 1rem; opacity: 0.95; }
        .card-body { padding: 45px 30px; text-align: center; }
        .btn-group { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 80px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #yesBtn { background: linear-gradient(135deg, #ff6b9d 0%, #ff4d6d 100%); color: white; box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3); }
        #yesBtn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 107, 157, 0.4); }
        #noBtn { background: #f0f0f0; color: #666; border: 2px solid #ddd; }
        #noBtn:hover { background: #e8e8e8; }
        .celebrate { text-align: center; color: #ff6b9d; }
        .celebrate h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 10px; }
        .celebrate p { color: #999; margin-bottom: 20px; }
        .footer { padding: 18px 30px; border-top: 1px solid #f0f0f0; font-size: 0.85rem; color: #999; text-align: center; }
        .footer a { color: #ff6b9d; text-decoration: none; font-weight: 600; }
        .hidden { display: none !important; }
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255,255,255,0.95);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .sound-toggle:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <canvas id="heartsCanvas"></canvas>
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
    <div class="card">
        <div class="card-header">
            <div class="rose-emoji">🌹</div>
            <h1 class="card-title">Will You Be My Valentine?</h1>
            <p class="card-subtitle"><span id="name">There</span>, I like you 💕</p>
        </div>
        <div class="card-body">
            <div id="askSection">
                <p style="font-size: 1.05rem; color: #555; margin-bottom: 25px;">I've been meaning to ask you something special. Will you be my Valentine? 💖</p>
                <div class="btn-group">
                    <button class="btn" id="yesBtn" onclick="sayYes()">Yes! 🥰</button>
                    <button class="btn" id="noBtn" onmouseover="dodgeBtn()" ontouchstart="dodgeBtn()">No</button>
                </div>
            </div>
            <div id="celebrateSection" class="celebrate hidden">
                <div style="font-size: 3rem; margin-bottom: 15px;">💕</div>
                <h2>Best Decision Ever!</h2>
                <p>You just made today the best day. 🌹✨</p>
                <button class="btn" style="background: linear-gradient(135deg, #ff6b9d 0%, #ff4d6d 100%); color: white; margin-top: 15px;" onclick="tryAgain()">← Try Again</button>
            </div>
        </div>
        <div class="footer">
            Made with 💕 by MagicCards | <a href="../../create.html">Create yours →</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('n') || 'There';
        document.getElementById('name').textContent = name;
        document.title = `Hey ${name}, will you be my Valentine? 💕`;

        let soundEnabled = true;
        let yesScale = 1;

        class SoundEffects {
            constructor() {
                try { this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (e) { this.audioContext = null; }
            }
            playRomantic() {
                if (!soundEnabled || !this.audioContext) return;
                const now = this.audioContext.currentTime;
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0, now + i * 0.15 + 0.3);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.3);
                });
            }
        }

        const sound = new SoundEffects();

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
        }

        // Canvas hearts
        const canvas = document.getElementById('heartsCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const hearts = [];

        function spawnHeart() {
            hearts.push({
                x: Math.random() * canvas.width,
                y: -30,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 1 + 0.5,
                size: Math.random() * 20 + 10,
                life: 1,
                rotation: Math.random() * Math.PI * 2
            });
        }

        function drawHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = hearts.length - 1; i >= 0; i--) {
                const h = hearts[i];
                h.x += h.vx;
                h.y += h.vy;
                h.vy += 0.02;
                h.life -= 0.004;

                if (h.y > canvas.height || h.life <= 0) {
                    hearts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = h.life * 0.6;
                ctx.translate(h.x, h.y);
                ctx.rotate(h.rotation);
                ctx.font = `${h.size}px serif`;
                ctx.fillText('❤️', 0, 0);
                ctx.restore();
            }
            requestAnimationFrame(drawHearts);
        }

        drawHearts();
        setInterval(spawnHeart, 400);

        function dodgeBtn() {
            const btn = document.getElementById('noBtn');
            const yes = document.getElementById('yesBtn');
            btn.style.position = 'fixed';
            btn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - 60) + 'px';
            yesScale = Math.min(yesScale + 0.12, 2.2);
            yes.style.transform = `scale(${yesScale})`;
            sound.playRomantic();
        }

        function sayYes() {
            document.getElementById('askSection').classList.add('hidden');
            document.getElementById('celebrateSection').classList.remove('hidden');
            document.getElementById('noBtn').style.display = 'none';
            sound.playRomantic();
            for (let i = 0; i < 50; i++) {
                setTimeout(spawnHeart, i * 50);
            }
        }

        function tryAgain() {
            document.getElementById('celebrateSection').classList.add('hidden');
            document.getElementById('askSection').classList.remove('hidden');
            const btn = document.getElementById('noBtn');
            btn.style.display = 'inline-flex';
            btn.style.position = 'relative';
            btn.style.left = '';
            btn.style.top = '';
            yesScale = 1;
            document.getElementById('yesBtn').style.transform = 'scale(1)';
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
