<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Will You Be Mine? | Valentine Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffc0e3 100%);
            background-attachment: fixed;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        
        .card {
            position: relative;
            z-index: 10;
            background: white;
            border-radius: 40px;
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,0.25);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: translateY(0); } }
        
        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06cb9 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        
        .emoji { font-size: 4rem; margin-bottom: 15px; animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        .title { font-family: 'Poppins', sans-serif; font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; }
        .subtitle { font-size: 0.95rem; opacity: 0.95; }
        
        .body {
            padding: 40px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .step-title { font-size: 1.4rem; font-weight: 700; color: #ff6b9d; margin-bottom: 20px; }
        .step-desc { font-size: 0.95rem; color: #666; margin-bottom: 20px; line-height: 1.6; }
        
        .choices { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 20px 0; }
        
        .choice-btn {
            padding: 18px 20px;
            border-radius: 18px;
            border: 2px solid #ffe0ea;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
        }
        
        .choice-btn:hover {
            border-color: #ff6b9d;
            background: #fff5f8;
            transform: translateX(8px);
        }
        
        .choice-btn.selected {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            color: white;
            border-color: transparent;
        }
        
        .result-box {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.1), rgba(255, 192, 227, 0.1));
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            border-left: 5px solid #ff6b9d;
            text-align: center;
        }
        
        .result-emoji { font-size: 3rem; margin-bottom: 15px; animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .result-text { font-size: 1rem; color: #333; line-height: 1.8; font-weight: 500; }
        
        .progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffe0ea;
            transition: all 0.3s;
        }
        
        .progress-dot.active {
            background: #ff6b9d;
            transform: scale(1.3);
        }
        
        .btn {
            padding: 14px 30px;
            border-radius: 50px;
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }
        
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255,255,255,0.95);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
    
    <div class="card">
        <div class="header">
            <div class="emoji">💕</div>
            <h1 class="title">A Valentine's Question</h1>
            <p class="subtitle">Let me guess your love language...</p>
        </div>
        
        <div class="body">
            <!-- STEP 1: Love Language -->
            <div class="section active" id="step1">
                <div class="progress">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                </div>
                <p class="step-title">What's your love language? 🌹</p>
                <p class="step-desc">Choose what makes your heart flutter:</p>
                <div class="choices">
                    <button class="choice-btn" onclick="selectLanguage('words')">💬 Words of Affirmation</button>
                    <button class="choice-btn" onclick="selectLanguage('time')">⏰ Quality Time Together</button>
                    <button class="choice-btn" onclick="selectLanguage('gifts')">🎁 Thoughtful Gifts</button>
                    <button class="choice-btn" onclick="selectLanguage('acts')">💪 Acts of Service</button>
                </div>
            </div>
            
            <!-- STEP 2: Date Vibe -->
            <div class="section" id="step2">
                <div class="progress">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot active"></div>
                    <div class="progress-dot"></div>
                </div>
                <p class="step-title">Perfect date would be... 🌙</p>
                <p class="step-desc">Paint me a picture:</p>
                <div class="choices">
                    <button class="choice-btn" onclick="selectDate('romantic')">🕯️ Candlelit Dinner</button>
                    <button class="choice-btn" onclick="selectDate('adventure')">🏔️ Adventure Awaits</button>
                    <button class="choice-btn" onclick="selectDate('cozy')">🏠 Cozy Night In</button>
                    <button class="choice-btn" onclick="selectDate('surprise')">🎪 Surprise Me!</button>
                </div>
            </div>
            
            <!-- STEP 3: Result -->
            <div class="section" id="step3">
                <div class="progress">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot active"></div>
                    <div class="progress-dot active"></div>
                </div>
                <p class="step-title">Your Perfect Valentine Match 💝</p>
                <div id="resultBox" class="result-box">
                    <div class="result-emoji" id="resultEmoji">✨</div>
                    <div class="result-text" id="resultText">Loading your destiny...</div>
                </div>
                <button class="btn btn-primary" onclick="location.reload()">🔄 Try Again</button>
            </div>
        </div>
    </div>

    <script>
        let soundEnabled = true;
        let currentStep = 1;
        let selectedLanguage = null;
        let selectedDate = null;
        
        class SoundEffects {
            constructor() {
                this.audioContext = null;
            }
            
            initAudio() {
                if (!this.audioContext) {
                    try {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        if (this.audioContext.state === 'suspended') {
                            this.audioContext.resume();
                        }
                    } catch (e) {}
                }
            }
            
            playRomantic() {
                if (!soundEnabled || !this.audioContext) return;
                this.initAudio();
                try {
                    const now = this.audioContext.currentTime;
                    const notes = [523.25, 659.25, 783.99, 659.25];
                    notes.forEach((freq, i) => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();
                        osc.type = 'sine';
                        osc.connect(gain);
                        gain.connect(this.audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.25, now + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
                        osc.start(now + i * 0.15);
                        osc.stop(now + i * 0.15 + 0.15);
                    });
                } catch (e) {}
            }
        }
        
        const sound = new SoundEffects();
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
        }
        
        function selectLanguage(lang) {
            selectedLanguage = lang;
            document.querySelectorAll('#step1 .choice-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            sound.playRomantic();
        }
        
        function selectDate(date) {
            selectedDate = date;
            document.querySelectorAll('#step2 .choice-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            sound.playRomantic();
        }
        
        function nextStep() {
            if (currentStep === 1 && !selectedLanguage) return;
            if (currentStep === 2 && !selectedDate) {
                generateResult();
                return;
            }
            currentStep++;
            showStep(currentStep);
        }
        
        function showStep(step) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            currentStep = step;
            
            if (currentStep === 1) {
                selectedLanguage = null;
                selectedDate = null;
            }
            
            if (currentStep === 2) {
                setTimeout(() => nextStep(), 100);
            }
            
            if (currentStep === 3) {
                spawnHearts(30);
            }
        }
        
        function generateResult() {
            const matches = {
                words_romantic: "A poetic soul! Your match recites love sonnets by candlelight. ✨",
                words_adventure: "An adventurer with a way with words! Love letters from mountaintops! 📮",
                words_cozy: "Intimate conversations under cozy blankets - your love language spoken perfectly. 🛋️",
                words_surprise: "Mystery + compliments = You two need spontaneous poetry nights! 📝",
                
                time_romantic: "Quality time = your love story. Endless nights together. 🌙",
                time_adventure: "Adventure buddies! Every moment with you is an expedition! 🎒",
                time_cozy: "Together is all you need. Comfort in presence alone. 💕",
                time_surprise: "Surprise dates to maximize every second together! ⏱️",
                
                gifts_romantic: "Thoughtful presents wrapped in romance. Every gift says 'I love you'. 🎀",
                gifts_adventure: "Adventure souvenirs with heartfelt meaning. The journey AND the gift! 🧳",
                gifts_cozy: "Homemade gifts by the fireplace. Handmade with love. 🧶",
                gifts_surprise: "Surprise gifts constantly! You collect joyful moments. 🎁",
                
                acts_romantic: "They show love through devotion & care. Romance through action. 💪",
                acts_adventure: "Actions speak louder than words on epic adventures together! 🏔️",
                acts_cozy: "Making life easier with love. The ultimate comfort. ❤️",
                acts_surprise: "Random acts of kindness that blow your mind! 🎊"
            };
            
            const key = selectedLanguage + '_' + selectedDate;
            const result = matches[key] || "Your love story is uniquely beautiful! 💫";
            
            document.getElementById('resultEmoji').textContent = '💕';
            document.getElementById('resultText').textContent = result;
            sound.playRomantic();
        }
        
        // Hearts animation
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        
        function spawnHearts(count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + 50,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 3 - 2,
                    size: Math.random() * 20 + 10,
                    life: 1
                });
            }
        }
        
        function drawHeart(x, y, size) {
            ctx.fillStyle = `rgba(255, 107, 157, 1)`;
            ctx.beginPath();
            ctx.moveTo(x, y + size / 4);
            ctx.bezierCurveTo(x - size / 2, y - size / 2, x - size / 1.5, y, x, y + size / 2);
            ctx.bezierCurveTo(x + size / 1.5, y, x + size / 2, y - size / 2, x, y + size / 4);
            ctx.fill();
        }
        
        function animateHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.y += p.vy;
                p.x += p.vx;
                p.vy += 0.05;
                p.life -= 0.008;
                
                if (p.y > canvas.height + 50 || p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.globalAlpha = p.life;
                drawHeart(p.x, p.y, p.size);
            }
            
            if (particles.length > 0) {
                requestAnimationFrame(animateHearts);
            }
        }
        
        animateHearts();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
